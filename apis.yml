- aid: sailpoint:sailpoint-certifications-api
  name: SailPoint Certifications API
  description: >-
    Use this API to implement certification functionality. Certifications enable administrators and designated
    reviewers to review users' access to entitlements and decide whether to approve, revoke, or reassign
    the review. Certification campaigns provide a structured process for periodic access reviews and compliance
    verification.
