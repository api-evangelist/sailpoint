- aid: sailpoint:sailpoint-access-profiles-api
  name: SailPoint Access Profiles API
  description: >-
    Use this API to implement and customize access profile functionality. Access profiles group entitlements,
    which represent access rights on sources. For example, an Active Directory source can have multiple
    entitlements grouped into an access profile such as 'AD Developers' combining 'Employees' and 'Developers'
    entitlements. Access profiles are used in provisioning, certifications, access requests, and roles.
  humanURL: ' https://developer.sailpoint.com/'
  tags:
  - Access Profiles
  properties:
