- aid: sailpoint:sailpoint-roles-api
  name: SailPoint Roles API
  description: >-
    Use this API to implement and customize role functionality. Roles represent the broadest level of
    access and group one or more access profiles. When you create a role and configure it with role criteria,
    Identity Security Cloud can automatically assign the role to qualified identities. Roles simplify
    access management for organizational positions.
  humanURL: ' https://developer.sailpoint.com/'
